name: rust-v2

on:
  push:
    branches: [main, feat/runner-fixes]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --all --check
      - name: Cargo check
        run: cargo check --locked --all-targets
      - name: Cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --locked --all-targets

  release-binaries:
    name: release binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: lto-rs-x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
            asset: lto-rs-aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: lto-rs-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Add release target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          staging="package/${{ matrix.asset }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/lto-rs" "$staging/lto-rs"
          chmod +x "$staging/lto-rs"
          tar -C "$staging" -czf "dist/${{ matrix.asset }}.tar.gz" lto-rs
          (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256")
      - name: Verify packaged binary
        shell: bash
        run: |
          shasum -a 256 -c "dist/${{ matrix.asset }}.tar.gz.sha256"
          verify_dir="$(mktemp -d)"
          tar -C "$verify_dir" -xzf "dist/${{ matrix.asset }}.tar.gz"
          "$verify_dir/lto-rs" self-test
      - name: Upload GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
      - name: Verify uploaded release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_dir="$(mktemp -d)"
          for attempt in 1 2 3 4 5; do
            if gh release download "$GITHUB_REF_NAME" \
              --pattern "${{ matrix.asset }}.tar.gz" \
              --pattern "${{ matrix.asset }}.tar.gz.sha256" \
              --dir "$verify_dir"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 5
          done
          (cd "$verify_dir" && shasum -a 256 -c "${{ matrix.asset }}.tar.gz.sha256")
          unpack_dir="$verify_dir/unpack"
          mkdir -p "$unpack_dir"
          tar -C "$unpack_dir" -xzf "$verify_dir/${{ matrix.asset }}.tar.gz"
          "$unpack_dir/lto-rs" self-test
