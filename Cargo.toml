[package]
name = "lto-rs"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Rust v2 core for Long Task Orchestration"

[lib]
name = "lto_rs"
path = "src/lib.rs"

[[bin]]
name = "lto-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
walkdir = "2.5"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
